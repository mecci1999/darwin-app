services:
  mysql:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: darwin_trails_it
      MYSQL_USER: darwin_trails_it
      MYSQL_PASSWORD: darwin_trails_it
      MYSQL_ROOT_PASSWORD: darwin_trails_it_root
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-udarwin_trails_it", "-pdarwin_trails_it"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
